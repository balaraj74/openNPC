[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opennpc"
version = "0.1.0"
description = "An open-source AI framework for autonomous game characters."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpenNPC Contributors" }]
keywords = ["games", "ai", "npc", "reinforcement-learning", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn>=0.22", "pydantic>=2"]
training = ["numpy>=1.24", "torch>=2"]
dev = ["pytest>=8", "httpx>=0.24"]

[project.scripts]
opennpc-api = "opennpc.api.service:main"
opennpc-demo = "opennpc.simulation.environment:main"

[tool.setuptools.packages.find]
include = ["opennpc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
